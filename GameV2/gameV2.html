<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--tittle of the website-->
    <title>BlackJack</title>
    <!--linking the js file-->
    <script src="gameV2.js">
    </script>
    <!--linking the css file-->
    <link href="gameV2.css" rel="stylesheet">
</head>
<body>
    <!--heading of the page-->
    <h1 id="heading">Play A Round of BlackJack</h1>
    
    <div id = "btns">
    <!--button on the page that starts game by calling fn function-->
    <button onclick="fn()" class = "button">Play</button>
    <!--button on the page that continues game by calling reroll function-->
    <button onclick="reroll()" class = "button" id = "btnreroll" hidden="true">Reroll</button>
    <!--button on the page that decides the game by calling keep function-->
    <button onclick="keep(playerName)" class = "button" id= "btnkeep" hidden = "true">Keep</button>
    </div>

    <nav>
        <p>Nav</p>
        <a href="../Index.html">Home</a>
    </nav>
</body>
</html>
